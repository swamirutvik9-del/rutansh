<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  {{ if .Site.Params.googleAnalytics }}
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ .Site.Params.googleAnalytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', '{{ .Site.Params.googleAnalytics }}');
  </script>
  {{ end }}

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{ partial "seo.html" . }}

  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  <link rel="icon" type="image/jpeg" href="/images/rutansh-logo.svg.jpeg">
  {{ with site.Home.OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}">{{ end }}

</head>

<body>
  <nav>
    <a href="/">Rutansh</a>
    <a href="/articles/">Articles</a>
    <a href="/about/">About</a>
  </nav>

  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
  <p>© Rutansh · A thinking space</p>
</footer>

  <!-- Hide-on-scroll behavior for the top navigation -->
  <script>
  (function(){
    var lastScroll = 0;
    var nav = document.querySelector('nav');
    if(!nav) return;
    window.addEventListener('scroll', function(){
      var current = window.pageYOffset || document.documentElement.scrollTop;
      if (current > lastScroll && current > 50){
        nav.classList.add('nav-hidden');
      } else {
        nav.classList.remove('nav-hidden');
      }
      lastScroll = current <= 0 ? 0 : current;
    }, {passive:true});
  })();
  </script>
</body>
</html>
